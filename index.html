<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spotify Popularity Predictor</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c27;
    --border: #2a2a3a;
    --accent: #1DB954;
    --accent2: #ff6b35;
    --accent3: #a78bfa;
    --text: #f0f0f5;
    --muted: #7070a0;
    --card-radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(29,185,84,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(29,185,84,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }
  .app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 48px; flex-wrap: wrap; gap: 16px;
  }
  .logo { display: flex; flex-direction: column; gap: 4px; }
  .logo-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 5vw, 48px); font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .logo-sub { color: var(--muted); font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; }
  .score-badge {
    display: flex; flex-direction: column; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--card-radius); padding: 16px 28px; min-width: 140px;
  }
  .score-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .score-value {
    font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: 52px; line-height: 1; transition: color 0.4s;
  }
  .score-bar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .score-bar-fill {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    transition: width 0.5s cubic-bezier(.4,0,.2,1); width: 0%;
  }
  .main-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }
  @media (max-width: 820px) { .main-grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--card-radius); padding: 24px;
  }
  .card-title {
    font-family: 'Syne', sans-serif; font-weight: 700;
    font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title::before { content: ''; display: block; width: 3px; height: 14px; border-radius: 2px; }
  .card-title.green::before { background: var(--accent); }
  .card-title.orange::before { background: var(--accent2); }
  .card-title.purple::before { background: var(--accent3); }
  .genre-search-wrap { position: relative; margin-bottom: 12px; }
  .genre-search {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 13px; outline: none; transition: border-color 0.2s;
  }
  .genre-search:focus { border-color: var(--accent3); }
  .genre-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 100; display: none;
  }
  .genre-dropdown.open { display: block; }
  .genre-opt {
    padding: 9px 14px; font-size: 13px; cursor: pointer;
    transition: background 0.15s; border-bottom: 1px solid var(--border);
  }
  .genre-opt:last-child { border-bottom: none; }
  .genre-opt:hover, .genre-opt.selected { background: var(--accent); color: #000; }
  .genre-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(167,139,250,0.15); border: 1px solid var(--accent3);
    border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--accent3); cursor: pointer;
  }
  .genre-tag:hover { background: rgba(167,139,250,0.25); }
  .sliders-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
  @media (max-width: 500px) { .sliders-grid { grid-template-columns: 1fr; } }
  .slider-row { display: flex; flex-direction: column; gap: 6px; }
  .slider-meta { display: flex; justify-content: space-between; align-items: center; }
  .slider-name { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .slider-val { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; color: var(--text); min-width: 42px; text-align: right; }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 4px;
    border-radius: 2px; outline: none; cursor: pointer; background: var(--border);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent3); box-shadow: 0 0 8px rgba(167,139,250,0.5); transition: transform 0.15s;
  }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.3); }
  .explicit-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px; margin-top: 16px; cursor: pointer;
  }
  .explicit-label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .toggle { width: 36px; height: 20px; background: var(--border); border-radius: 10px; position: relative; transition: background 0.25s; }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%; background: white; transition: transform 0.25s;
  }
  .toggle.on::after { transform: translateX(16px); }
  .right-panel { display: flex; flex-direction: column; gap: 20px; }
  .comparison-wrap { display: flex; flex-direction: column; gap: 10px; }
  .comp-row { display: flex; align-items: center; gap: 10px; }
  .comp-label { font-size: 11px; color: var(--muted); min-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comp-bar-bg { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .comp-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .comp-val { font-size: 11px; color: var(--muted); min-width: 28px; text-align: right; }
  .importance-list { display: flex; flex-direction: column; gap: 8px; }
  .imp-row { display: flex; align-items: center; gap: 8px; }
  .imp-name { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; min-width: 100px; }
  .imp-bar-bg { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .imp-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .tracks-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
  .track-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; transition: border-color 0.2s;
  }
  .track-item:hover { border-color: var(--accent3); }
  .track-num { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px; color: var(--accent); min-width: 28px; text-align: center; }
  .track-info { flex: 1; min-width: 0; }
  .track-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .track-pop { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; color: var(--accent3); min-width: 32px; text-align: right; }
  .pulse { animation: pulse 0.3s ease-out; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>

  { key:'tempo',            label:'Tempo (BPM)',    min:40,  max:220, step:1,    def:123  },
];

let selectedGenre = 'pop';
let explicit = 0;
const vals = {};
SLIDERS.forEach(s => vals[s.key] = s.def);

// sliders
const grid = document.getElementById('slidersGrid');
SLIDERS.forEach(s => {
  const row = document.createElement('div');
  row.className = 'slider-row';
  const meta = document.createElement('div');
  meta.className = 'slider-meta';
  const name = document.createElement('span');
  name.className = 'slider-name';
  name.textContent = s.label;
  const valEl = document.createElement('span');
  valEl.className = 'slider-val';
  valEl.id = 'val_' + s.key;
  valEl.textContent = s.def;
  meta.appendChild(name); meta.appendChild(valEl);
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = s.min; inp.max = s.max; inp.step = s.step; inp.value = s.def;
  inp.id = 'sl_' + s.key;
  inp.addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    vals[s.key] = v;
    valEl.textContent = s.key === 'loudness' ? v.toFixed(1) : s.key === 'tempo' ? Math.round(v) : v.toFixed(2);
    update();
  });
  row.appendChild(meta); row.appendChild(inp);
  grid.appendChild(row);
});

const toggleEl = document.getElementById('toggleEl');
document.getElementById('explicitToggle').addEventListener('click', () => {
  explicit = 1 - explicit;
  toggleEl.classList.toggle('on', explicit === 1);
  update();
});

const genres = Object.keys(MODEL.genre_coef).sort();
const searchEl = document.getElementById('genreSearch');
const dropdown = document.getElementById('genreDropdown');
const tagEl    = document.getElementById('genreTag');

function renderDropdown(filter) {
  const filtered = genres.filter(g => g.includes(filter.toLowerCase()));
  const items = filtered.slice(0, 40);
  dropdown.innerHTML = '';
  items.forEach(g => {
    const d = document.createElement('div');
    d.className = 'genre-opt' + (g === selectedGenre ? ' selected' : '');
    d.dataset.g = g; d.textContent = g;
    dropdown.appendChild(d);
  });
  dropdown.classList.toggle('open', items.length > 0 && document.activeElement === searchEl);
}

searchEl.addEventListener('input', () => renderDropdown(searchEl.value));
searchEl.addEventListener('focus', () => renderDropdown(searchEl.value));
document.addEventListener('click', e => {
  if (!e.target.closest('.genre-search-wrap')) dropdown.classList.remove('open');
});
dropdown.addEventListener('click', e => {
  const opt = e.target.closest('.genre-opt');
  if (!opt) return;
  selectedGenre = opt.dataset.g;
  searchEl.value = '';
  dropdown.classList.remove('open');
  renderTag(); update();
});

function renderTag() {
  tagEl.innerHTML = '';
  if (selectedGenre) {
    const t = document.createElement('div');
    t.className = 'genre-tag';
    t.textContent = selectedGenre + ' ✕';
    t.onclick = () => { selectedGenre = null; renderTag(); update(); };
    tagEl.appendChild(t);
  }
}
renderTag();

// predict
function predict() {
  const c = MODEL.audio_coef;
  let score = MODEL.intercept;
  score += c.danceability * vals.danceability;
  score += c.energy * vals.energy;
  score += c.loudness * vals.loudness;
  score += c.speechiness * vals.speechiness;
  score += c.acousticness * vals.acousticness;
  score += c.instrumentalness * vals.instrumentalness;
  score += c.liveness * vals.liveness;
  score += c.valence * vals.valence;
  score += c.tempo * vals.tempo;
  score += c.log_duration * Math.log1p(210000);
  score += c.explicit * explicit;
  if (selectedGenre && MODEL.genre_coef[selectedGenre] !== undefined) {
    score += MODEL.genre_coef[selectedGenre];
  }
  return Math.max(0, Math.min(100, Math.round(score)));
}

function updateComparison(myScore) {
  const means = MODEL.genre_means;
  let items = [];
  if (selectedGenre && means[selectedGenre]) {
    items.push({ label: selectedGenre + ' avg', val: means[selectedGenre], color: 'var(--accent)' });
  }
  items.push({ label: 'Your track', val: myScore, color: 'var(--accent3)' });
  const top3 = Object.entries(means).sort((a,b) => b[1]-a[1]).slice(0,3);
  top3.forEach(([g,v]) => { if (g !== selectedGenre) items.push({ label: g + ' avg', val: v, color: 'var(--muted)' }); });
  items.sort((a,b) => b.val - a.val);
  const max = Math.max(...items.map(i => i.val), 1);
  const wrap = document.getElementById('comparisonWrap');
  wrap.innerHTML = '';
  items.forEach(item => {
    const row = document.createElement('div'); row.className = 'comp-row';
    const lbl = document.createElement('div'); lbl.className = 'comp-label'; lbl.title = item.label; lbl.textContent = item.label;
    const bg = document.createElement('div'); bg.className = 'comp-bar-bg';
    const fill = document.createElement('div'); fill.className = 'comp-bar-fill';
    fill.style.width = (item.val / max * 100).toFixed(1) + '%';
    fill.style.background = item.color;
    bg.appendChild(fill);
    const num = document.createElement('div'); num.className = 'comp-val';
    num.style.color = item.color;
    num.textContent = typeof item.val === 'number' ? item.val.toFixed(0) : item.val;
    row.appendChild(lbl); row.appendChild(bg); row.appendChild(num);
    wrap.appendChild(row);
  });
}

function updateImportance() {
  const c = MODEL.audio_coef;
  const feats = SLIDERS.map(s => {
    const range = s.max - s.min;
    const impact = Math.abs(c[s.key] * range);
    return { label: s.label, impact, positive: c[s.key] >= 0 };
  });
  feats.sort((a,b) => b.impact - a.impact);
  const maxImp = feats[0].impact;
  const list = document.getElementById('importanceList');
  list.innerHTML = '';
  feats.forEach(f => {
    const row = document.createElement('div'); row.className = 'imp-row';
    const nm = document.createElement('div'); nm.className = 'imp-name'; nm.textContent = f.label;
    const bg = document.createElement('div'); bg.className = 'imp-bar-bg';
    const fill = document.createElement('div'); fill.className = 'imp-bar-fill';
    fill.style.width = (f.impact / maxImp * 100).toFixed(1) + '%';
    fill.style.background = f.positive ? 'var(--accent)' : 'var(--accent2)';
    bg.appendChild(fill);
    const dir = document.createElement('div'); dir.className = 'imp-dir';
    dir.textContent = f.positive ? '↑' : '↓';
    dir.style.color = f.positive ? 'var(--accent)' : 'var(--accent2)';
    row.appendChild(nm); row.appendChild(bg); row.appendChild(dir);
    list.appendChild(row);
  });
}

function updateSimilar() {
  const pool = selectedGenre ? TRACKS.filter(t => t.track_genre === selectedGenre) : TRACKS;
  const tlist = document.getElementById('tracksList');
  if (!pool.length) { tlist.innerHTML = '<div style="color:var(--muted);font-size:12px">No tracks found</div>'; return; }
  function dist(t) {
    const keys = ['danceability','energy','speechiness','acousticness','instrumentalness','liveness','valence'];
    let d = keys.reduce((sum, k) => sum + Math.pow((t[k]||0) - (vals[k]||0), 2), 0);
    d += Math.pow(((t.loudness+50)/55) - ((vals.loudness+50)/55), 2);
    d += Math.pow((t.tempo/243) - (vals.tempo/243), 2);
    return Math.sqrt(d);
  }
  const scored = pool.map(t => Object.assign({}, t, { _dist: dist(t) })).sort((a,b) => a._dist - b._dist).slice(0, 5);
  tlist.innerHTML = '';
  scored.forEach((t, i) => {
    const item = document.createElement('div'); item.className = 'track-item';
    const num = document.createElement('div'); num.className = 'track-num'; num.textContent = i + 1;
    const info = document.createElement('div'); info.className = 'track-info';
    const tn = document.createElement('div'); tn.className = 'track-name'; tn.textContent = t.track_name;
    const ta = document.createElement('div'); ta.className = 'track-artist'; ta.textContent = t.artists;
    info.appendChild(tn); info.appendChild(ta);
    const pop = document.createElement('div'); pop.className = 'track-pop'; pop.textContent = t.popularity;
    item.appendChild(num); item.appendChild(info); item.appendChild(pop);
    tlist.appendChild(item);
  });
}

function update() {
  const score = predict();
  const sv = document.getElementById('scoreVal');
  sv.textContent = score;
  sv.classList.remove('pulse');
  void sv.offsetWidth;
  sv.classList.add('pulse');
  const hue = Math.round(score * 1.2);
  sv.style.color = 'hsl(' + hue + ', 80%, 60%)';
  document.getElementById('scoreBar').style.width = score + '%';
  updateComparison(score);
  updateSimilar();
}

renderDropdown('');
updateImportance();
update();
</script>
</body>
</html>
